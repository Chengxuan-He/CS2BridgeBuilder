  <g id="original-icon" transform="translate(136.32 290) scale(1.03)">
<title id="bridge-title">Bridge Builder — 可编辑桥梁</title>
  <desc id="bridge-desc">双塔双索面斜拉桥。桥塔为独立竖直塔柱，无横梁；四根立柱的轴线分别对齐桥面两侧边缘，桥墩与立柱上下对齐。每侧16个不同的斜拉索锚点沿桥面边缘排列，普通相邻锚点间距为d，立柱轴线到前后最近锚点的距离各为d，跨过立柱的两个最近锚点间距为2d。两塔之间的相邻锚点仍保持间距d，左右两侧一一对应，桥塔到两端的纵向退距对称。三个坐标轴等比例投影，水平结构沿正负30度方向延伸。平涂钢蓝、暖灰桥面和浅蓝水面，无车道线及路面装饰。透明背景，全部元素为可编辑矢量。</desc>
  <!-- Isometric: X = (sqrt(3)/2, -1/2), Y = (sqrt(3)/2, 1/2), Z = (0, -1). -->
