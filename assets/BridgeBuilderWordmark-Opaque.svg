  <title id="brand-title">Bridge Builder — Rajdhani Bold</title>
  <desc id="brand-desc">Rajdhani Bold 700, outlined lettering, square composition. Both r letters are long-jib cranes without hooks. The l is a pencil pointing upward. Original bridge and pencil artwork retained on an opaque pale blue-gray background.</desc>
