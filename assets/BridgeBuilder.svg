<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="bridge-title bridge-desc">
  <title id="bridge-title">简约正等轴测斜拉桥</title>
  <desc id="bridge-desc">双塔双索面斜拉桥。桥塔为独立竖直塔柱，无横梁；两侧扇形斜拉索锚固于桥面梁边缘。三个坐标轴等比例投影，水平结构沿正负30度方向延伸。平涂钢蓝、暖灰桥面和浅蓝水面，无车道线及路面装饰。透明背景，全部元素为可编辑矢量。</desc>
