<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Isometric cable-stayed bridge">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#617487"/>
      <stop offset="1" stop-color="#263746"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6b07b"/>
      <stop offset="1" stop-color="#a9753f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7dfe4"/>
      <stop offset="1" stop-color="#7ca8b3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Water and the bridge's cast shadow establish a compact isometric ground plane. -->
  <path d="M48 371 349 205 470 271 169 437Z" fill="url(#water)" opacity=".72"/>
  <path d="M86 393 366 239 451 285 171 439Z" fill="#263746" opacity=".24" filter="url(#shadow)"/>

  <!-- Piers below the deck. -->
  <g fill="url(#steel)" stroke="#263746" stroke-width="5" stroke-linejoin="round">
    <path d="m174 320 27 15-5 85-27-15Z"/>
    <path d="m229 350 27 15-5 85-27-15Z"/>
    <path d="m169 405 82 45-21 12-82-45Z"/>
    <path d="m330 232 24 13-4 68-24-13Z"/>
    <path d="m379 259 24 13-4 68-24-13Z"/>
    <path d="m326 300 73 40-19 11-73-40Z"/>
  </g>

  <!-- Deck: top, fascia and underside are separate planes for a physical, low-colour form. -->
  <path d="M48 326 374 147 464 196 138 375Z" fill="url(#deck)" stroke="#263746" stroke-width="7" stroke-linejoin="round"/>
  <path d="m48 326 90 49v27l-90-49Z" fill="#a9753f" stroke="#263746" stroke-width="7" stroke-linejoin="round"/>
  <path d="m138 375 326-179v27L138 402Z" fill="#263746" stroke="#263746" stroke-width="7" stroke-linejoin="round"/>
  <path d="M75 326 376 161M121 351 422 186" fill="none" stroke="#f0f3f4" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <path d="M112 319 385 169" fill="none" stroke="#263746" stroke-width="5" stroke-dasharray="22 16" stroke-linecap="round" opacity=".78"/>

  <!-- Two steel portal pylons, vertical in world space and tied across the deck. -->
  <g fill="none" stroke="url(#steel)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M171 299 171 139M249 342 249 182M171 139 249 182"/>
    <path d="M298 229 298 89M376 272 376 132M298 89 376 132"/>
  </g>
  <g fill="none" stroke="#f0f3f4" stroke-width="3" stroke-linecap="round" opacity=".55">
    <path d="M166 296 166 140M244 339 244 183M293 226 293 90M371 269 371 133"/>
  </g>

  <!-- Fan cables on both visible planes retain the unmistakable cable-stayed silhouette. -->
  <g fill="none" stroke="#f0f3f4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M171 139 65 318M171 139 105 296M171 139 139 278M171 139 213 252M171 139 251 231"/>
    <path d="M298 89 220 241M298 89 260 220M298 89 337 172M298 89 380 151M298 89 426 177M298 89 455 193"/>
  </g>
  <g fill="none" stroke="#617487" stroke-width="4" stroke-linecap="round" opacity=".78">
    <path d="M249 182 142 367M249 182 186 342M249 182 224 321M249 182 287 279"/>
    <path d="M376 132 301 286M376 132 337 266M376 132 410 226M376 132 448 205"/>
  </g>

  <!-- Minimal edge rails and tower caps complete the scale cues without adding another colour. -->
  <path d="M49 316 374 137 465 186M138 365 464 186" fill="none" stroke="#263746" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f0f3f4" stroke="#263746" stroke-width="4">
    <path d="m158 132 13-7 13 7-13 8Z"/>
    <path d="m285 82 13-7 13 7-13 8Z"/>
  </g>
</svg>
